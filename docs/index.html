<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up - Attendance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Attendance Portal</h1>
    </header>
    <main>
        <section id="signup-section">
            <h2>Sign Up</h2>
            <form id="student-signup-form">
                <div>
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="fullName" required>
                </div>
                <div>
                    <label for="year">Year:</label>
                    <input type="number" id="year" name="year" required>
                </div>
                <div>
                    <label for="program">Program:</label>
                    <input type="text" id="program" name="program" required>
                </div>
                <div>
                    <label for="student-username">Username:</label>
                    <input type="text" id="student-username" name="username" required>
                </div>
                <div>
                    <label for="student-password">Password:</label>
                    <input type="password" id="student-password" name="password" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="login.html">Login instead</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Attendance Tracker</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
